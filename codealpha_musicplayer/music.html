<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player">

        <h2>🎵 Music Player</h2>

        <!-- Album Cover -->
        <img
            src="https://img.informer.com/articles_uploads/2/2340/cool-backgrounds-hd-music-7773.jpg"
            class="cover"
            alt="Album Cover">

        <!-- Song Information -->
        <div class="song-info">
            <h3 id="title">Song Title</h3>
            <p id="artist">Artist Name</p>
        </div>

        <!-- Audio Element -->
        <audio id="audio"></audio>

        <!-- Progress Bar -->
        <input
            type="range"
            id="progress"
            value="0"
            min="0"
            max="100">

        <!-- Time Display -->
        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prev">⏮</button>
            <button id="play">▶</button>
            <button id="next">⏭</button>
        </div>

        <!-- Volume Control -->
        <div class="volume">
            <label for="volume">🔊 Volume</label>
            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.1"
                value="1">
        </div>

        <!-- Playlist -->
        <h4>🎶 Playlist</h4>
        <ul id="playlist"></ul>

    </div>

    <script src="script.jss"></script>

</body>
</html>
