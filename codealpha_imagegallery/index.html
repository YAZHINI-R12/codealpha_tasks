<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>
<link rel="stylesheet" href="st.css">
</head>
<body>

<h1>Responsive Image Gallery</h1>

<div class="filters">
    <h1>Filter Categories</h1>
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animals')">Animals</button>
    <br><br>
    <h1>Filter Effects</h1>
    <button onclick="applyEffect('none')">Normal</button>
    <button onclick="applyEffect('grayscale')">Grayscale</button>
    <button onclick="applyEffect('sepia')">Sepia</button>
    <button onclick="applyEffect('blur')">Blur</button>
    <button onclick="applyEffect('brightness')">Bright</button>
</div>

<div class="gallery">

    <div class="image nature">
        <img src="https://picsum.photos/id/10/500/350" onclick="openLightbox(0)">
    </div>

    <div class="image nature">
        <img src="https://picsum.photos/id/11/500/350" onclick="openLightbox(1)">
    </div>

    <div class="image nature">
        <img src="https://picsum.photos/id/12/500/350" onclick="openLightbox(2)">
    </div>

    <div class="image nature">
        <img src="https://picsum.photos/id/13/500/350" onclick="openLightbox(3)">
    </div>

    <div class="image city">
        <img src="https://picsum.photos/id/1011/500/350" onclick="openLightbox(4)">
    </div>

    <div class="image city">
        <img src="https://picsum.photos/id/1012/500/350" onclick="openLightbox(5)">
    </div>

    <div class="image city">
        <img src="https://picsum.photos/id/1013/500/350" onclick="openLightbox(6)">
    </div>

    <div class="image city">
        <img src="https://picsum.photos/id/1014/500/350" onclick="openLightbox(7)">
    </div>

    <div class="image animals">
        <img src="https://picsum.photos/id/237/500/350" onclick="openLightbox(8)">
    </div>

    <div class="image animals">
        <img src="https://picsum.photos/id/433/500/350" onclick="openLightbox(9)">
    </div>

    <div class="image animals">
        <img src="https://picsum.photos/id/593/500/350" onclick="openLightbox(10)">
    </div>

    <div class="image animals">
        <img src="https://picsum.photos/id/659/500/350" onclick="openLightbox(11)">
    </div>

</div>

<div id="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>

    <button class="prev" onclick="changeImage(-1)">❮</button>

    <img id="lightbox-img">

    <button class="next" onclick="changeImage(1)">❯</button>
</div>

<script src="sc.jss"></script>

</body>
</html>
